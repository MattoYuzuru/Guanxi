<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <title></title>
    <script>
      // Тему ставим до первой отрисовки, иначе будет вспышка светлого фона.
      try {
        var stored = localStorage.getItem('guanxi.theme') || 'system'
        var dark =
          stored === 'dark' ||
          (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        // Appearance (density, graphics tier, motion) before first paint, so nothing jumps.
        var appearance = JSON.parse(localStorage.getItem('guanxi.appearance.v1') || '{}')
        document.documentElement.dataset.density = appearance.density === 'compact' ? 'compact' : 'comfortable'
        document.documentElement.dataset.graphics = appearance.graphics === 'max' ? 'max' : 'static'
        if (appearance.motion === 'reduced' || appearance.motion === 'full') document.documentElement.dataset.motion = appearance.motion
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
