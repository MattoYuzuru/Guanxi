name: Scoped Swift toolchain diagnosis
on:
  push:
    branches: [codex/ci-toolchain]
permissions:
  contents: read
jobs:
  policy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode: '16.4'
          - os: macos-15
            xcode: '26.3'
          - os: macos-26
            xcode: '26.6'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
      GUANXI_PROVIDER_KEYS_FILE: ''
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '26.9.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Observe selected native toolchain
        run: |
          sw_vers
          xcrun swiftc --version
      - name: Reproduce only the synthetic policy probe
        run: node --import ./packages/server/test/setup/no-ambient-key-file.mjs --test --test-name-pattern='wires the production access-control' packages/server/test/ui-catalog-signer-exit-gates.test.ts
